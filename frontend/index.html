<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- My CSS -->
    <link rel="stylesheet" href="css\style.css">
</head>


<body>

    <!-- ================= HEADER ================= -->

    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">

            <a class="navbar-brand fw-bold" href="#">
                Expense Tracker
            </a>

        </div>
    </nav>


    <!-- ================= BODY ================= -->

    <div class="container my-4">

        <!-- ===== INFORMATION CARDS ===== -->

        <div class="row g-3 mb-4">

            <!-- Total -->
            <div class="col-md-4">

                <div class="card text-center h-100">

                    <div class="card-body">

                        <h5 class="card-title">
                            Total 
                        </h5>

                        <h2 id="totalAmount">
                            $0.00
                        </h2>

                    </div>

                </div>

            </div>


            <!-- Number -->
            <div class="col-md-4">

                <div class="card text-center h-100">

                    <div class="card-body">

                        <h5 class="card-title">
                            Number of Expenses
                        </h5>

                        <h2 id="expenseCount">
                            0
                        </h2>

                    </div>

                </div>

            </div>


            <!-- Highest -->
            <div class="col-md-4">

                <div class="card text-center h-100">

                    <div class="card-body">

                        <h5 class="card-title">
                            Highest Expense
                        </h5>

                        <h2 id="highestAmount">
                            $0.00
                        </h2>

                        <p
                            id="highestTitle"
                            class="text-muted mb-0"
                        >
                            Groceries
                        </p>

                    </div>

                </div>

            </div>

        </div>


        <!-- ===== ADD EXPENSE ===== -->

        <div class="card mb-4">

            <div class="card-header fw-bold">
                Add Expense
            </div>


            <div class="card-body">

                <form id="expenseForm">

                    <div class="row g-3">

                        <!-- Title -->
                        <div class="col-md-6">

                            <label
                                for="title"
                                class="form-label"
                            >
                                Title
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="title"
                                placeholder="Enter expense title"
                            >

                        </div>


                        <!-- Amount -->
                        <div class="col-md-6">

                            <label
                                for="amount"
                                class="form-label"
                            >
                                Amount
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="amount"
                                placeholder="Enter amount"
                                step="0.01"
                            >

                        </div>


                        <!-- Category -->
                        <div class="col-md-6">

                            <label
                                for="category"
                                class="form-label"
                            >
                                Category
                            </label>

                            <select
                                id="category"
                                class="form-select"
                            >

                                <option value="">
                                    Choose category
                                </option>

                                <option value="Food">
                                    Food
                                </option>

                                <option value="Transport">
                                    Transport
                                </option>

                                <option value="Shopping">
                                    Shopping
                                </option>

                                <option value="Bills">
                                    Bills
                                </option>

                                <option value="Entertainment">
                                    Entertainment
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <!-- Date -->
                        <div class="col-md-6">

                            <label
                                for="date"
                                class="form-label"
                            >
                                Date
                            </label>

                            <input
                                type="date"
                                class="form-control"
                                id="date"
                            >

                        </div>


                        <!-- Button -->
                        <div class="col-12">

                            <button
                                type="submit"
                                id="submitButton"
                                class="btn btn-primary"
                            >
                                Add Expense
                            </button>

                        </div>

                    </div>

                </form>

            </div>

        </div>


        <!-- ===== EXPENSES TABLE ===== -->

        <div class="card">

            <div
                class="card-header d-flex justify-content-between align-items-center"
            >

                <h5 class="mb-0">
                    Expenses
                </h5>


                <!-- Filter -->
                <div class="d-flex align-items-center gap-2">

                    <label
                        for="filterCategory"
                        class="mb-0"
                    >
                        Category:
                    </label>

                    <select
                        id="filterCategory"
                        class="form-select form-select-sm"
                    >

                        <option value="All">
                            All
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Transport">
                            Transport
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Bills">
                            Bills
                        </option>

                        <option value="Entertainment">
                            Entertainment
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>

            </div>


            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-light">

                            <tr>

                                <th>
                                    Title
                                </th>

                                <th>
                                    Amount
                                </th>

                                <th>
                                    Category
                                </th>

                                <th>
                                    Date
                                </th>

                                <th>
                                    Actions
                                </th>

                            </tr>

                        </thead>


                        <tbody id="expenseTable">

                        </tbody>

                    </table>

                </div>


                <div
                    id="emptyMessage"
                    class="text-center text-muted py-3"
                >
                    No expenses found.
                </div>

            </div>

        </div>

    </div>


    <!-- ================= FOOTER ================= -->

    <footer class="bg-dark text-white text-center py-3 mt-5">

        <p class="mb-0">
            Expense Tracker © 2026
        </p>

    </footer>


    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- My JavaScript -->

    <script src="js\app.js"></script>

</body>

</html>
